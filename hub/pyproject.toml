[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homehub"
version = "0.1.0"
description = "Home Hub: a private phone app and Claude chat for a Linux home server"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "pillow",
]

[project.optional-dependencies]
kdeconnect = ["dbus-next"]
router = ["tplinkrouterc6u"]
cast = ["pychromecast"]
ps5 = ["pyremoteplay==0.7.6", "pyee<9", "async_timeout"]
psn = ["psnawp>=3.1"]
lights = ["python-kasa"]
dev = ["pytest"]

[project.scripts]
homehub = "homehub.cli:main"
homehub-agent = "homehub.pc_agent.server:main"

[tool.setuptools.packages.find]
include = ["homehub*"]

[tool.setuptools.package-data]
"homehub.pc_agent" = ["*.ps1"]
"homehub.remote_app" = ["*.html", "*.js", "*.css", "*.json", "*.svg", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "unit: no hardware, no network",
    "claude: real Claude requests through the subscription login",
    "live: real devices and daemons, skipped when absent",
    "slow: takes more than a few seconds",
]
